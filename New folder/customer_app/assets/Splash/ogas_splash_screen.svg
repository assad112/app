<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="orangeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  
  <!-- Full screen background -->
  <rect width="1080" height="1920" fill="url(#orangeBg)"/>
  
  <!-- Centered icon container -->
  <g transform="translate(540, 800)">
    <!-- Icon background card -->
    <rect x="-200" y="-200" width="400" height="400" rx="92" fill="#FFFFFF" opacity="0.15"/>
    
    <!-- Cylinder -->
    <g transform="translate(0, -20)">
      <path d="M -55 -158 Q -55 -218 0 -218 Q 55 -218 55 -158" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round"/>
      <rect x="-19" y="-188" width="38" height="44" fill="#FFFFFF" rx="5"/>
      <path d="M -50 -138 L -50 -118 L 50 -118 L 50 -138 Z" fill="#FFFFFF"/>
      <rect x="-94" y="-118" width="188" height="30" rx="10" fill="#FFFFFF"/>
      <rect x="-94" y="-88" width="188" height="206" rx="14" fill="#FFFFFF"/>
      <rect x="-94" y="-88" width="20" height="206" fill="#FED7AA" opacity="0.5"/>
      <rect x="-94" y="-9" width="188" height="14" fill="#EA580C"/>
      <rect x="-104" y="118" width="208" height="24" rx="7" fill="#FFFFFF"/>
    </g>
  </g>
  
  <!-- OGAS brand text -->
  <text x="540" y="1320" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="140" font-weight="bold" letter-spacing="20">OGAS</text>
  
  <!-- Tagline -->
  <text x="540" y="1400" text-anchor="middle" fill="#FFEDD5" font-family="Arial, sans-serif" font-size="42" letter-spacing="6">الغاز الموثوق</text>
  
  <!-- Loading dots at bottom -->
  <g transform="translate(540, 1700)">
    <circle cx="-40" cy="0" r="8" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="40" cy="0" r="8" fill="#FFFFFF"/>
  </g>
</svg>
